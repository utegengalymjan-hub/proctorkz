app = "proctorkz-CHANGE-ME"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "proctorkz_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
